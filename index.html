<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <header class="cabecalho">
      <img class="logo" src="img/logo.svg" alt="logo do x-men">
   </header> 
   <main class="selecao-de-personagens">
      <section class="personagens">
        <h1 class="titulo">Selecione um personagem
        </h1>
        <ul class="lista de personagens">
           <li class="personagem" id="ciclope" data-name="Ciclope"
           data-description="Ele tem o poder de disparar rajadas ópticas
           por um acidente com ele quando criança, mas não consegue controlá-lo">
              <img src="img/card-ciclope.jpg" alt="Personagens Ciclope">

           </li>
           <li class="personagem" id="jean-grey" data-name="jean-grey"
           data-description="Jean-grey é uma mutante nível ômega e o principal avatar da
           força fenix, no qual manifesta poderes cósmicos. A telepatia e teleciness">
              <img src="img/jean-grey.jpg" alt="Personagens jean-grey">

           </li>
           <li class="personagem" id="lince-negra" data-name="lince-negra"
           data-description="Ela tem o poder de atravessar matéria sólida, campos de
           energia, rajadas ópticas, continuando intacta, e também tem o poder de andar no ar">
              <img src="img/card-lince-negra.jpg" alt="Personagens lince-negra">

           </li>
        </ul>
        <li class="personagem" id="tempestade" data-name="tempestade"
        data-description="Tem o pode que é controlar as forças da natureza muito poderosa, ela pode produzir
        , raios, chuvas, gelos, ventos, neblina, entre outros efeitos">
           <img src="img/card-tempestade.jpg" alt="Personagens tempestade">

        </li>
        <li class="personagem" id="volverine" data-name="volverine"
        data-description="Ele tem o poder de disparar rajadas ópticas
        por um acidente com ele quando criança, mas não consegue controlá-lo">
           <img src="img/card-volverine.jpg" alt="Personagens volverine">

        </li>
        <li class="personagem" id="noturno" data-name="noturno"
        data-description="Ele tem o poder de disparar rajadas ópticas
        por um acidente com ele quando criança, mas não consegue controlá-lo">
           <img src="img/card-noturno.jpg" alt="Personagens noturno">

        </li>
        <li class="personagem" id="magneto" data-name="magneto"
        data-description="Ele tem o poder de disparar rajadas ópticas
        por um acidente com ele quando criança, mas não consegue controlá-lo">
           <img src="img/card-magneto.jpg" alt="Personagens magneto">

        </li>
       
      </section>
   </main>
</body>
</html>
